[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biolit-mcp"
version = "0.1.0"
description = "MCP server that grounds LLM answers in PubMed and UniProt, with a citation verifier and an eval suite that measures citation hallucination."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "llm", "pubmed", "uniprot", "bioinformatics", "rag", "evals"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]
eval = ["anthropic>=0.40"]

[project.scripts]
biolit-mcp = "biolit_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biolit_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
